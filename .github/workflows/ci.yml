name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --frozen
      - run: make test
      - run: make lint
      - run: make typecheck
      - run: uv build --wheel

